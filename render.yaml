databases:
  - name: whatsapp-sales-db
    databaseName: whatsapp_sales
    user: db_user
    plan: free

services:
  - type: web
    name: whatsapp-sales-app
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -c 'from app import app, db; app.app_context().push(); db.create_all()' && gunicorn app:app"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: whatsapp-sales-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.6"
